{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPMS Ferma</title>
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'website/img/favicon-32.png' %}">
    <link rel="stylesheet" href="{% static 'website/css/style.css' %}">
</head>
<body class="{% block body_class %}{% endblock %}">
<header class="top-nav">
    <a href="{% url 'landing' %}" class="brand-mark" aria-label="FERMA home">
        <img src="{% static 'website/img/ferma_logo.png' %}" alt="FERMA logo" class="brand-mark-logo">
        <span class="brand-mark-ring">FR</span>
    </a>
    <nav class="main-nav" aria-label="Primary navigation">
        <a href="{% url 'landing' %}" class="{% if active_page == 'home' %}is-active{% endif %}">Home</a>
        <a href="{% url 'road_inventory' %}" class="{% if active_page == 'inventory' %}is-active{% endif %}">Road Inventory</a>
        <a href="{% url 'road_motorability' %}" class="{% if active_page == 'road_motorability' %}is-active{% endif %}">Road Motorability</a>
        <a href="{% url 'road_condition' %}" class="{% if active_page == 'road_condition' %}is-active{% endif %}">Road condition</a>
        <a href="{% url 'library' %}" class="{% if active_page == 'library' %}is-active{% endif %}">Library</a>
        <a href="{% url 'engineering_admin' %}" class="{% if active_page == 'engineering_admin' %}is-active{% endif %}">Engineering</a>
    </nav>
    <a href="" class="account-chip" aria-label="User account">
        <img src="{% static 'website/img/iconoir_user.svg' %}" alt="" class="account-chip-icon">
        <p class="account-chip-initials">AO</p>
    </a>
</header>
<main class="main-content">
    <section class="page-title-bar">{% block page_title %}{% endblock %}</section>
    {% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
  (function () {
    if (window.__topNavAjaxBound) return;
    window.__topNavAjaxBound = true;

    const headerSelector = "header.top-nav";
    const mainSelector = "main.main-content";

    async function executeScriptsSequentially(scripts) {
      for (const oldScript of scripts) {
        const newScript = document.createElement("script");
        for (const attr of oldScript.attributes) {
          newScript.setAttribute(attr.name, attr.value);
        }

        if (oldScript.src) {
          await new Promise((resolve, reject) => {
            newScript.onload = resolve;
            newScript.onerror = reject;
            document.body.appendChild(newScript);
          });
        } else {
          newScript.textContent = oldScript.textContent;
          document.body.appendChild(newScript);
          newScript.remove();
        }
      }
    }

    async function swapTopNavPage(url, pushStateEntry) {
      window.__topNavAjaxNavigating = true;
      try {
        const response = await fetch(url, { credentials: "same-origin" });
        if (!response.ok) {
          throw new Error("Unable to load page.");
        }
        const html = await response.text();
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, "text/html");

        const nextHeader = doc.querySelector(headerSelector);
        const nextMain = doc.querySelector(mainSelector);
        const currentHeader = document.querySelector(headerSelector);
        const currentMain = document.querySelector(mainSelector);
        if (!nextHeader || !nextMain || !currentHeader || !currentMain) {
          window.location.href = url;
          return;
        }

        const nextScripts = Array.from(nextMain.querySelectorAll("script"));
        currentHeader.replaceWith(nextHeader);
        currentMain.replaceWith(nextMain);
        document.body.className = doc.body.className;
        if (doc.title) document.title = doc.title;

        if (pushStateEntry) {
          window.history.pushState({ ajaxTopNav: true }, "", url);
        }

        await executeScriptsSequentially(nextScripts);

        const path = new URL(url, window.location.origin).pathname;
        if (path === "{% url 'road_inventory' %}") {
          window.dispatchEvent(new CustomEvent("shared-leaflet:refresh", { detail: { id: "roadInventoryLeafletMap" } }));
        } else if (path === "{% url 'road_motorability' %}") {
          window.dispatchEvent(new CustomEvent("shared-leaflet:refresh", { detail: { id: "roadMotorabilityLeafletMap" } }));
        }
      } finally {
        window.__topNavAjaxNavigating = false;
      }
    }

    document.addEventListener("click", function (event) {
      const link = event.target.closest(".top-nav a");
      if (!link) return;
      if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
      if (link.target && link.target !== "_self") return;
      if (link.hasAttribute("download")) return;
      if (link.origin !== window.location.origin) return;
      event.preventDefault();
      swapTopNavPage(link.href, true).catch(function () {
        window.location.href = link.href;
      });
    });

    window.addEventListener("popstate", function () {
      swapTopNavPage(window.location.href, false).catch(function () {
        window.location.reload();
      });
    });
  })();
</script>
</body>
</html>
