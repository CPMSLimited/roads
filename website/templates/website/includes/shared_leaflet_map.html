{% load static %}
<div
    id="{{ map_dom_id|default:'sharedLeafletMap' }}"
    class="shared-leaflet-map"
    data-map-data-url="{% url map_data_url_name|default:'segments_map_data' %}"
></div>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<style>
  .shared-leaflet-map {
    width: 100%;
    height: 893px;
    border-radius: 12px;
  }
</style>
<script>
  (function () {
    const mapId = "{{ map_dom_id|default:'sharedLeafletMap' }}";
    const mapTheme = "{{ map_theme|default:'default' }}";
    const mapEl = document.getElementById(mapId);
    if (!mapEl || typeof L === "undefined") return;

    const dataUrl = mapEl.dataset.mapDataUrl;
    const statesGeojsonUrl = "{% static 'website/data/nigeria_states.geojson' %}";
    let map = null;
    let geojsonLayer = null;
    let statesLayer = null;
    let selectedStateLayer = null;
    let outsideMaskLayer = null;
    let statesFetchPromise = null;
    const nigeriaBounds = L.latLngBounds([4.2, 2.7], [13.9, 14.7]);
    const worldRing = [
      [-90, -180],
      [-90, 180],
      [90, 180],
      [90, -180]
    ];

    function hasActiveDataFilters(params) {
      const filterKeys = ["route", "state", "segment", "subsegment"];
      return filterKeys.some((key) => {
        const value = (params.get(key) || "").trim();
        return value !== "";
      });
    }

    function statusToHex(raw) {
      const cleaned = String(raw || "").replace("#", "").trim();
      return /^[0-9a-fA-F]{6}$/.test(cleaned) ? cleaned.toUpperCase() : "666699";
    }

    function normalizeStateName(value) {
      const cleaned = String(value || "")
        .trim()
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, " ")
        .replace(/\s+/g, " ");
      if (!cleaned) return "";
      if (cleaned === "abuja" || cleaned === "fct" || cleaned === "f c t" || cleaned === "federal capital territory") {
        return "fct";
      }
      return cleaned;
    }

    function featureStateName(feature) {
      const props = feature?.properties || {};
      return normalizeStateName(props.statename || props.state || props.name || "");
    }

    function featureColorHex(feature) {
      if (mapTheme === "inventory") {
        const routeCode = String(feature?.properties?.route || "").trim().toUpperCase();
        if (routeCode.startsWith("A")) return "6495ED";
        if (routeCode.startsWith("F")) return "DC143C";
        return "808080";
      }
      return statusToHex(feature?.properties?.status);
    }

    function ensureMap() {
      if (map) return;
      map = L.map(mapEl);
      if (!map.getPane("maskPane")) {
        map.createPane("maskPane");
        map.getPane("maskPane").style.zIndex = "350";
      }
      if (!map.getPane("statesPane")) {
        map.createPane("statesPane");
        map.getPane("statesPane").style.zIndex = "360";
      }
      if (!map.getPane("selectedStatePane")) {
        map.createPane("selectedStatePane");
        map.getPane("selectedStatePane").style.zIndex = "370";
      }
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "&copy; OpenStreetMap contributors"
      }).addTo(map);
    }

    function holesFromFeatures(features) {
      const holes = [];
      (features || []).forEach((feature) => {
        const geometry = feature?.geometry || {};
        const coords = geometry.coordinates || [];
        if (geometry.type === "Polygon") {
          if (coords[0]?.length) {
            holes.push(coords[0].map(([lng, lat]) => [lat, lng]));
          }
          return;
        }
        if (geometry.type === "MultiPolygon") {
          coords.forEach((polygon) => {
            if (polygon?.[0]?.length) {
              holes.push(polygon[0].map(([lng, lat]) => [lat, lng]));
            }
          });
        }
      });
      return holes;
    }

    function renderStatesOverlay(statesData, selectedStateName) {
      const allFeatures = (statesData?.features || []).filter((feature) => feature?.geometry?.type);
      const normalizedSelectedState = normalizeStateName(selectedStateName);
      const matchedFeatures = normalizedSelectedState
        ? allFeatures.filter((feature) => featureStateName(feature) === normalizedSelectedState)
        : [];
      const focusFeatures = matchedFeatures.length ? matchedFeatures : allFeatures;

      if (selectedStateLayer) {
        map.removeLayer(selectedStateLayer);
        selectedStateLayer = null;
      }
      if (statesLayer) {
        map.removeLayer(statesLayer);
        statesLayer = null;
      }
      if (outsideMaskLayer) {
        map.removeLayer(outsideMaskLayer);
        outsideMaskLayer = null;
      }

      outsideMaskLayer = L.polygon([worldRing, ...holesFromFeatures(focusFeatures)], {
        pane: "maskPane",
        interactive: false,
        stroke: false,
        fillColor: "#f4f6f5",
        fillOpacity: 0.7,
        fillRule: "evenodd"
      }).addTo(map);

      statesLayer = L.geoJSON(statesData, {
        pane: "statesPane",
        interactive: false,
        style: function () {
          return {
            color: "#7d8e8a",
            weight: 1,
            opacity: 0.75,
            fillOpacity: 0
          };
        }
      }).addTo(map);

      if (matchedFeatures.length) {
        selectedStateLayer = L.geoJSON(
          { type: "FeatureCollection", features: matchedFeatures },
          {
            pane: "selectedStatePane",
            interactive: false,
            style: function () {
              return {
                color: "#40524d",
                weight: 2.6,
                opacity: 0.95,
                fillOpacity: 0
              };
            }
          }
        ).addTo(map);
      }
    }

    async function ensureStatesData() {
      ensureMap();
      if (!statesFetchPromise) {
        statesFetchPromise = fetch(statesGeojsonUrl, { headers: { "X-Requested-With": "XMLHttpRequest" } })
          .then((response) => {
            if (!response.ok) throw new Error("Could not load Nigeria states layer.");
            return response.json();
          });
      }
      return statesFetchPromise;
    }

    async function loadData() {
      ensureMap();
      const params = new URLSearchParams(window.location.search);
      const statesData = await ensureStatesData();
      try {
        renderStatesOverlay(statesData, params.get("state"));
      } catch (error) {
        renderStatesOverlay(statesData, "");
      }
      const url = new URL(dataUrl, window.location.origin);
      params.forEach((value, key) => url.searchParams.set(key, value));

      try {
        const resp = await fetch(url.toString(), { headers: { "X-Requested-With": "XMLHttpRequest" } });
        const data = await resp.json();
        if (!resp.ok) return;

        if (geojsonLayer) {
          map.removeLayer(geojsonLayer);
        }

        geojsonLayer = L.geoJSON(data, {
          style: function(feature) {
            const color = `#${featureColorHex(feature)}`;
            return { color: color, weight: 3, opacity: 0.95 };
          },
          pointToLayer: function(feature, latlng) {
            return L.circleMarker(latlng, {
              radius: 5,
              color: `#${featureColorHex(feature)}`,
              fillOpacity: 0.9,
            });
          },
          onEachFeature: function(feature, layer) {
            const p = feature.properties || {};
            const route = p.route || "-";
            const code = p.code || "-";
            const state = p.state || "-";
            const distance = p.distance ?? "-";
            const speed = p.avg_speed ?? "-";
            layer.bindPopup(
              `<strong>${code}</strong><br>Route: ${route}<br>State: ${state}<br>Distance: ${distance} km<br>Avg speed: ${speed} km/h`
            );
          }
        }).addTo(map);
        if (geojsonLayer && geojsonLayer.bringToFront) {
          geojsonLayer.bringToFront();
        }

        const bounds = geojsonLayer.getBounds();
        const hasFilters = hasActiveDataFilters(params);
        if (bounds.isValid()) {
          if (hasFilters) {
            map.fitBounds(bounds, { padding: [20, 20] });
          } else {
            // map.fitBounds(nigeriaBounds, { padding: [20, 20] });
            map.setView([9.082, 8.6753], 7);
          }
        } else {
          // map.fitBounds(nigeriaBounds, { padding: [20, 20] });
          map.setView([9.082, 8.6753], 7);
        }
      } catch (error) {
      }
    }

    async function refreshMap() {
      await loadData();
      if (map) {
        setTimeout(() => map.invalidateSize(), 0);
      }
    }

    window.addEventListener("shared-leaflet:refresh", function (event) {
      const targetId = event?.detail?.id;
      if (!targetId || targetId === mapId) {
        refreshMap();
      }
    });

    if (mapEl.offsetParent !== null) {
      refreshMap();
    }
  })();
</script>
